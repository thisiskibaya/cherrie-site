<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title>Page not found | chérie</title>
	<style>
		:root { color-scheme: light; }
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 2rem;
			background: #f7f1e8;
			color: #552404;
			font-family: "Outfit", "Helvetica Neue", Arial, sans-serif;
		}
		main {
			width: min(38rem, 100%);
			padding: clamp(2rem, 6vw, 4rem);
			border: 1px solid rgba(85, 36, 4, 0.18);
			border-radius: 1.5rem;
			background: #fffaf4;
			text-align: center;
			box-shadow: 0 1.5rem 4rem rgba(85, 36, 4, 0.08);
		}
		p { line-height: 1.65; }
		.eyebrow { margin: 0 0 0.6rem; font-size: 0.78rem; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.7; }
		h1 { margin: 0 0 1rem; font-size: clamp(2rem, 8vw, 3.5rem); line-height: 1; }
		.links { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem; margin-top: 2rem; }
		a { padding: 0.75rem 1.1rem; border-radius: 999px; background: #552404; color: #fffaf4; text-decoration: none; }
		a:hover, a:focus-visible { background: #7a3710; }
	</style>
</head>
<body>
	<main>
		<p class="eyebrow">chérie · static review</p>
		<h1>Page not found</h1>
		<p>This page is not part of the static review build. The bakery menu, story, and contact pages are still available.</p>
		<nav class="links" aria-label="Useful pages">
			<a href="/">Home</a>
			<a href="/our-menu/">Our menu</a>
			<a href="/contact/">Contact</a>
		</nav>
	</main>
</body>
</html>
